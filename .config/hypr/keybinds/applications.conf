# ========================================
# APPLICATION KEYBINDINGS
# Launch and manage applications
# ========================================

# ========================================
# PRIMARY APPLICATIONS
# ========================================
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, pgrep rofi || $launcher -show drun

# ========================================
# SYSTEM UTILITIES
# ========================================
bind = $mainMod, Escape, exec, pgrep wlogout || wlogout -b 2
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" -theme ~/.config/rofi/theme.rasi | cliphist decode | wl-copy

# ========================================
# WAYBAR MANAGEMENT
# ========================================
bind = $mainMod CTRL, W, exec, pkill waybar && hyprctl dispatch exec waybar
bind = $mainMod ALT, W, exec, pgrep -x waybar >/dev/null && killall waybar || waybar &
