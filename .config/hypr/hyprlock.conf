source = $HOME/.config/hypr/config/variables.conf
source = $HOME/.config/hypr/hyprlock-colors.conf

# HYPRLOCK CONFIGURATION
background {
    monitor =
    path = /home/zishan/.cache/wallpaper-static.png
    blur_passes = 2
    contrast = 1
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    shadow_passes = 0
    shadow_color = rgba(0, 0, 0, 0.0)
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.35
    dots_center = true
    outer_color = $lock_primary
    inner_color = $lock_bg
    font_color = $lock_fg
    check_color = $lock_check
    capslock_color = $lock_error
    fade_on_empty = true
    rounding = -1
    placeholder_text = <span foreground="##f2f3f4"></span>
    fail_text = <span foreground="##f2f3f4"></span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# Date Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $lock_fg
    font_size = 22
    font_family = $fontMono
    position = 0, 300
    halign = center
    valign = center
}

# Time Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 0.8)
    font_size = 95
    font_family = $fontMono ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# Music Status Display
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/scripts/media/music-status.sh)"
    color = rgba(242, 243, 244, 0.8)
    font_size = 18
    font_family = $fontMono
    position = 0, -375
    halign = center
    valign = center
}
